<style>
  :root {
    --bg: #eef4ea;
    --card: #fbfbf5;
    --ink: #17251a;
    --ink-soft: #5c6e57;
    --border: #d7e6cf;
    --primary: #007700;
    --primary-dark: #045c1f;
    --primary-fg: #ffffff;
    --accent: #c99a2e;
    --accent-ink: #4a3708;
    --accent-soft: rgba(201, 154, 46, 0.16);
    --shadow: 0 1px 2px rgba(4,60,10,0.07), 0 1px 8px rgba(4,60,10,0.06);
    --shadow-hover: 0 2px 4px rgba(4,60,10,0.09), 0 4px 16px rgba(4,60,10,0.11);
    --radius: 14px;
  }
  body {
    background-image:
      radial-gradient(1100px 480px at 100% -10%, rgba(0,119,0,0.07), transparent 60%),
      radial-gradient(900px 420px at -10% 15%, rgba(201,154,46,0.08), transparent 55%);
    background-attachment: fixed;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .display {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  button { font-family: inherit; }
  #app { min-height: 100dvh; padding-bottom: 4rem; }

  header {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(160deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: var(--primary-fg);
    border-bottom: 3px solid var(--accent);
  }
  .header-inner {
    max-width: 880px; margin: 0 auto; padding: 1rem 1.1rem 1.1rem;
    display: flex; flex-direction: column; gap: 0.9rem;
  }
  .eyebrow-row { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; }
  .eyebrow { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.75; }
  .count { font-size: 0.85rem; font-variant-numeric: tabular-nums; opacity: 0.85; }
  h1 { margin: 0.15rem 0 0; font-size: 2.1rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1; }

  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); opacity: 0.55; pointer-events: none; }
  #search {
    width: 100%; height: 2.75rem; border-radius: 10px; border: none;
    padding: 0 2.6rem 0 2.5rem; font-size: 0.95rem;
    background: rgba(255,255,255,0.94); color: var(--ink);
  }
  #search:focus { outline: 2px solid rgba(255,255,255,0.5); outline-offset: 1px; }
  #search::placeholder { color: #948d7c; }
  .clear-search {
    position: absolute; right: 0.35rem; top: 50%; transform: translateY(-50%);
    width: 2rem; height: 2rem; border: none; background: none; color: #6f6a5e;
    display: none; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer;
  }
  .clear-search.show { display: flex; }

  .loc-wrap { position: relative; }
  .loc-wrap svg { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); opacity: 0.55; pointer-events: none; }
  #loc-input {
    width: 100%; height: 2.5rem; border-radius: 10px; border: none;
    padding: 0 2.4rem 0 2.5rem; font-size: 0.88rem;
    background: rgba(255,255,255,0.85); color: var(--ink);
  }
  #loc-input:focus { outline: 2px solid rgba(255,255,255,0.5); outline-offset: 1px; }
  #loc-input::placeholder { color: #6f8a68; }
  .clear-loc {
    position: absolute; right: 0.3rem; top: 50%; transform: translateY(-50%);
    width: 1.8rem; height: 1.8rem; border: none; background: none; color: #4a5c46;
    display: none; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer;
  }
  .clear-loc.show { display: flex; }
  .loc-hint { margin: 0.3rem 0 0; font-size: 0.72rem; color: rgba(255,255,255,0.75); }

  .decide-btn {
    width: 100%; height: 2.75rem; border: none; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 0.92rem;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    transition: transform 0.12s ease;
  }
  .decide-btn:active { transform: scale(0.98); }

  nav.tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.25rem;
    background: rgba(255,255,255,0.12); border-radius: 10px; padding: 0.25rem;
  }
  nav.tabs button {
    height: 2.4rem; border: none; border-radius: 7px; background: none; color: var(--primary-fg);
    font-size: 0.88rem; font-weight: 500; cursor: pointer; opacity: 0.85;
  }
  nav.tabs button.active { background: var(--card); color: var(--ink); opacity: 1; box-shadow: var(--shadow); }

  main { max-width: 880px; margin: 0 auto; padding: 1.4rem 1.1rem 2rem; }
  .lede { max-width: 30rem; font-size: 0.92rem; line-height: 1.5; color: var(--ink-soft); margin: 0 0 1.4rem; }

  .region-grid { display: grid; gap: 2rem; grid-template-columns: 1fr; }
  @media (min-width: 700px) { .region-grid { grid-template-columns: 1fr 1fr; column-gap: 3.5rem; } }
  .region-group h2 {
    font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em;
    color: var(--ink-soft); margin: 0 0 0.6rem;
  }
  .region-group ul { list-style: none; margin: 0; padding: 0; }
  .region-row {
    width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    background: none; border: none; text-align: left; padding: 0.6rem 0; cursor: pointer; color: var(--ink);
    border-bottom: 1px solid var(--border);
  }
  .region-group ul li:last-child .region-row { border-bottom: none; }
  .region-row.active { color: var(--primary-dark); }
  .region-row .name { font-family: Georgia, serif; font-size: 1.2rem; font-weight: 600; letter-spacing: -0.01em; }
  .region-row .n { color: var(--ink-soft); font-variant-numeric: tabular-nums; font-weight: 500; }

  .list-head { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; margin-bottom: 0.9rem; }
  .list-count { font-size: 0.88rem; color: var(--ink-soft); }
  .list-count b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
  .clear-link { border: none; background: none; color: var(--primary-dark); font-weight: 600; font-size: 0.88rem; cursor: pointer; padding: 0.3rem 0; }

  .chip-row { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.3rem; margin: 0 0 0.7rem; scrollbar-width: none; }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; height: 2.2rem; padding: 0 0.9rem; border-radius: 999px; border: none; cursor: pointer;
    font-size: 0.85rem; font-weight: 500; background: var(--card); color: var(--ink); box-shadow: var(--shadow);
  }
  .chip.active { background: var(--primary); color: var(--primary-fg); }

  .cards { list-style: none; margin: 0.4rem 0 0; padding: 0; display: grid; gap: 0.8rem; grid-template-columns: 1fr; }
  @media (min-width: 700px) { .cards { grid-template-columns: 1fr 1fr; } }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 0.85rem 0.9rem; box-shadow: var(--shadow);
    transition: box-shadow 0.15s ease;
  }
  .card:hover { box-shadow: var(--shadow-hover); }
  .card-top { display: flex; align-items: flex-start; gap: 0.5rem; }
  .card-main { flex: 1; min-width: 0; background: none; border: none; text-align: left; padding: 0.15rem 0.1rem; cursor: pointer; color: var(--ink); }
  .card-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
  .card-title { font-family: Georgia, serif; font-size: 1.12rem; font-weight: 600; letter-spacing: -0.005em; }
  .card-tipo { flex-shrink: 0; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .card-place { margin: 0.2rem 0 0; font-size: 0.86rem; color: var(--ink-soft); }
  .card-spec { margin: 0.2rem 0 0; font-size: 0.88rem; line-height: 1.4; }
  .card-uncertain { margin: 0.4rem 0 0; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-ink); }
  .fav-btn {
    flex-shrink: 0; width: 2.5rem; height: 2.5rem; border-radius: 999px; border: none; background: none; cursor: pointer;

  }
  .fav-btn svg { width: 1.15rem; height: 1.15rem; }
  .fav-btn.saved svg { fill: var(--accent); stroke: var(--accent); }
  .row-label { margin: 0.7rem 0 0.35rem; font-size: 0.66rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.4rem; }
  .btn-row a {
    display: flex; align-items: center; justify-content: center; height: 2.1rem; border-radius: 8px;
    font-size: 0.78rem; font-weight: 600; text-decoration: none; border: 1px solid var(--border); color: var(--ink);
  }
  .btn-row.maps a { background: var(--ink); color: var(--primary-fg); border-color: var(--ink); }
  .btn-row a:hover { opacity: 0.85; }

  .empty { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 2.5rem 1.5rem; text-align: center; }

  .empty .body { max-width: 22rem; margin: 0 auto; font-size: 0.9rem; color: var(--ink-soft); line-height: 1.5; }

  .quick-group h2 { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: var(--ink-soft); margin: 0 0 0.4rem; }
  .quick-group { margin-bottom: 1.8rem; }

  .quick-row {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 1rem;

  .quick-row .want { display: block; font-size: 0.82rem; color: var(--ink-soft); }
  .quick-row .label { display: block; font-family: Georgia, serif; font-size: 1.08rem; font-weight: 600; margin-top: 0.1rem; }
  .quick-row svg { flex-shrink: 0; opacity: 0.5; }

  /* Drawer */
  #overlay {
    position: fixed; inset: 0; background: rgba(28,26,22,0.35); z-index: 50; opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;

  #overlay.open { opacity: 1; pointer-events: auto; }
  #drawer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; margin: 0 auto; max-width: 34rem;
    max-height: min(42rem, 92dvh); background: var(--card); border-radius: 18px 18px 0 0;
    display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.25s cubic-bezier(.32,.72,0,1);

  #drawer.open { transform: translateY(0); }
  .drawer-handle { width: 2.5rem; height: 4px; border-radius: 999px; background: var(--border); margin: 0.75rem auto 0.4rem; flex-shrink: 0; }
  .drawer-body { min-height: 0; flex: 1; overflow-y: auto; padding: 0.6rem 1.4rem calc(1.5rem + env(safe-area-inset-bottom)); }
  .drawer-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
  .drawer-title { font-family: Georgia, serif; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; line-height: 1.15; }
  .drawer-place { margin: 0.25rem 0 0; font-size: 0.9rem; color: var(--ink-soft); }
  .drawer-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.8rem 0 0; }
  .tag { border-radius: 999px; padding: 0.3rem 0.75rem; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; background: var(--border); }
  .tag.uncertain { background: var(--accent-soft); color: var(--accent-ink); }
  .drawer-spec { margin: 1rem 0 0; font-size: 1rem; line-height: 1.5; }
  .drawer-addr, .drawer-notes { margin: 0.65rem 0 0; font-size: 0.87rem; line-height: 1.5; color: var(--ink-soft); }
  .mini-map {
    margin: 0.85rem 0 0; height: 11rem; border-radius: 10px; overflow: hidden;

  .mini-map .leaflet-container { background: var(--border); font-family: inherit; }
  .mini-map-status {

    font-size: 0.78rem; color: var(--ink-soft); text-align: center; padding: 0 1rem;

  .contact-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.5rem; }
  .contact-row a, .contact-row .disabled {
    display: flex; align-items: center; justify-content: center; gap: 0.4rem; height: 2.5rem; border-radius: 9px;
    border: 1px solid var(--border); font-size: 0.85rem; font-weight: 600; text-decoration: none; color: var(--ink);
  }
  .contact-row .disabled { opacity: 0.4; }
  .close-x { flex-shrink: 0; width: 2.4rem; height: 2.4rem; border-radius: 999px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  @media (prefers-reduced-motion: reduce) {
    #drawer, .decide-btn, #overlay { transition: none !important; }
  }
</style>
</head>

<div id="drawer">

  <div class="drawer-body" id="drawer-body"></div>
</div>

    shuffle: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
    chevron: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
    phone: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    globe: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
    pin: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>'
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---- State ----
  var state = {
    tab: "lista",
    search: "",
    provincia: null,
    zona: null,
    tipo: null,
    focus: null, // { ids, label }
    selectedId: null,
    myLocation: loadLoc()
  };

  var app = document.getElementById("app");

  function currentFiltered() {
    return filterRestaurants({
      search: state.search,
      provincia: state.focus ? null : state.provincia,
      zona: state.focus ? null : state.zona,
      tipo: state.focus ? null : state.tipo,
      ids: state.focus ? state.focus.ids : null,
      includeUncertain: true
    });
  }

  function showingList() {
    return state.tab === "guardados" || Boolean(state.search.trim()) || Boolean(state.focus) || Boolean(state.provincia) || Boolean(state.tipo);
  }

  function clearFilters() {
    state.search = ""; state.provincia = null; state.zona = null; state.tipo = null; state.focus = null;
    render();
  }

  function selectProvincia(next) {
    state.focus = null; state.provincia = next; state.zona = null; state.tab = "lista";
    render();
  }

  function onQuickPick(item) {
    var found = item.ids.map(function (id) { return byId.get(id); }).filter(Boolean);
    if (found.length === 1) { openDrawer(found[0].id); return; }
    state.search = ""; state.provincia = null; state.zona = null; state.tipo = null;
    state.focus = { ids: item.ids, label: item.want };
    state.tab = "lista";
    render();
  }

  function decide() {
    var locPool = locationPool();
    var pick = locPool ? pickRandom(locPool) : null;

    if (!pick) {
      var fromView;
      if (state.tab === "guardados") {
        fromView = favIds.map(function (id) { return byId.get(id); }).filter(Boolean);
      } else {
        fromView = filterRestaurants({
          search: state.search, provincia: state.focus ? null : state.provincia,
          zona: state.focus ? null : state.zona, tipo: state.focus ? null : state.tipo,
          ids: state.focus ? state.focus.ids : null, includeUncertain: false
        });
      }
      pick = pickRandom(fromView) || pickRandom(filterRestaurants({ search: "", provincia: null, zona: null, tipo: null, ids: null, includeUncertain: false }));
    }
    if (pick) openDrawer(pick.id);
  }

  function cardHtml(r) {
    var fav = isFav(r.id);
    var tipoLabel = r.tipo ? (TIPO_LABEL[r.tipo] || r.tipo) : "";
    return (
      '<li><article class="card" data-id="' + r.id + '">' +
        '<div class="card-top">' +
          '<button type="button" class="card-main" data-open="' + r.id + '">' +
            '<div class="card-title-row"><h3 class="card-title">' + esc(r.nome) + '</h3>' +
              (tipoLabel ? '<span class="card-tipo">' + esc(tipoLabel) + '</span>' : '') +
            '</div>' +
            '<p class="card-place">' + esc(placeLine(r)) + '</p>' +
            (r.especialidade ? '<p class="card-spec">' + esc(r.especialidade) + '</p>' : '') +
            (r.estado === "incerto" ? '<p class="card-uncertain">Por confirmar</p>' : '') +
          '</button>' +
          '<button type="button" class="fav-btn' + (fav ? ' saved' : '') + '" data-fav="' + r.id + '" aria-label="Guardar">' + ICON.heart + '</button>' +
        '</div>' +
        '<div style="margin-top:0.5rem">' + mapsRowHtml(r) + '</div>' +
      '</article></li>'
    );
  }

  function mapsRowHtml(r) {
    var l = mapsLinks(r);
    return '<div class="btn-row maps">' +
      '<a href="' + l.google + '" target="_blank" rel="noreferrer">Google</a>' +
      '<a href="' + l.apple + '" target="_blank" rel="noreferrer">Apple</a>' +
      '<a href="' + l.waze + '" target="_blank" rel="noreferrer">Waze</a>' +
    '</div>';
  }

  function emptyHtml(title, body) {
    return '<div class="empty"><p class="title">' + esc(title) + '</p><p class="body">' + esc(body) + '</p></div>';
  }

  function regionIndexHtml() {
    var html = '<div class="region-grid">';
    REGION_GROUPS.forEach(function (group) {
      var rows = group.provincias.map(function (p) {
        var n = PROV_COUNTS.get(p) || 0;
        if (!n) return "";
        var active = state.provincia === p;
        return '<li><button type="button" class="region-row' + (active ? ' active' : '') + '" data-region="' + esc(p) + '">' +
          '<span class="name">' + esc(p) + '</span><span class="n">' + n + '</span></button></li>';
      }).join("");
      if (!rows) return;
      html += '<section class="region-group"><h2>' + esc(group.title) + '</h2><ul>' + rows + '</ul></section>';
    });
    html += '</div>';
    return html;
  }

  function quickPicksHtml() {
    var html = '';
    pickGroups.forEach(function (group) {
      html += '<section class="quick-group"><h2>' + esc(group.region) + '</h2><ul>';
      group.items.forEach(function (item) {
        html += '<li><button type="button" class="quick-row" data-want="' + esc(item.want) + '" data-ids="' + item.ids.join(",") + '">' +
          '<span class="min0"><span class="want">' + esc(item.want) + '</span><span class="label">' + esc(item.label) + '</span></span>' +
          ICON.chevron + '</button></li>';
      });
      html += '</ul></section>';
    });
    return html;
  }

  function listResultsHtml(list, zonas, tipos) {
    var html = '<div class="list-head"><p class="list-count"><b>' + list.length + '</b> ' + (list.length === 1 ? "sítio" : "sítios") +
      (state.provincia && !state.focus ? " · " + esc(state.provincia) : "") +
      (state.focus ? " · " + esc(state.focus.label) : "") +
      '</p><button type="button" class="clear-link" id="clear-btn">Limpar</button></div>';

    if (!state.focus && zonas.length > 1) {
      html += '<div class="chip-row">';
      html += '<button type="button" class="chip' + (!state.zona ? ' active' : '') + '" data-zona="">Todas as zonas</button>';
      zonas.forEach(function (z) {
        html += '<button type="button" class="chip' + (state.zona === z ? ' active' : '') + '" data-zona="' + esc(z) + '">' + esc(z) + '</button>';
      });
      html += '</div>';
    }
    if (!state.focus && tipos.length > 1) {
      html += '<div class="chip-row">';
      html += '<button type="button" class="chip' + (!state.tipo ? ' active' : '') + '" data-tipo="">Qualquer tipo</button>';
      tipos.forEach(function (t) {
        html += '<button type="button" class="chip' + (state.tipo === t ? ' active' : '') + '" data-tipo="' + esc(t) + '">' + esc(TIPO_LABEL[t] || t) + '</button>';
      });
      html += '</div>';
    }

    if (!list.length) {
      html += emptyHtml("Nenhum sítio com isto", "Tenta outra terra, outro nome, ou limpa os filtros.");
    } else {
      html += '<ul class="cards">' + list.map(cardHtml).join("") + '</ul>';
    }
    return html;
  }

  function render() {
    var total = openCount();
    var headerHtml =
      '<header><div class="header-inner">' +
        '<div><div class="eyebrow-row"><p class="eyebrow">by ForumSCP</p><p class="count">' + total + ' sítios</p></div>' +
        '<h1 class="display">Guia Porta-10A</h1></div>' +
        '<div class="search-wrap">' + ICON.search +
          '<input id="search" type="text" placeholder="Um sítio, uma terra, uma especialidade" value="' + esc(state.search) + '" aria-label="Procurar">' +
          '<button type="button" class="clear-search' + (state.search ? ' show' : '') + '" id="clear-search" aria-label="Limpar pesquisa">' + ICON.x + '</button>' +
        '</div>' +
        '<div class="loc-wrap">' + ICON.pin +
          '<input id="loc-input" type="text" placeholder="Onde estás? (opcional, ex: Barcelos, Almada…)" value="' + esc(state.myLocation) + '" aria-label="Onde estás">' +
          '<button type="button" class="clear-loc' + (state.myLocation ? ' show' : '') + '" id="clear-loc" aria-label="Limpar localização">' + ICON.x + '</button>' +
        '</div>' +
        (state.myLocation ? '<p class="loc-hint">O "Decide por mim" dá prioridade a sítios perto de "' + esc(state.myLocation) + '".</p>' : '') +
        '<button type="button" class="decide-btn" id="decide-btn">' + ICON.shuffle + ' Decide por mim</button>' +
        '<nav class="tabs" aria-label="Secções">' +
          ['lista:Sítios', 'depressa:Depressa', 'guardados:Guardados'].map(function (pair) {
            var parts = pair.split(":"); var id = parts[0], label = parts[1];
            return '<button type="button" data-tab="' + id + '" class="' + (state.tab === id ? "active" : "") + '">' + label + '</button>';
          }).join("") +
        '</nav>' +
      '</div></header>';

    var mainHtml = '<main>';
    if (state.tab === "depressa") {
      mainHtml += '<p class="lede">Atalhos. Se só tens meio minuto, começa aqui.</p>' + quickPicksHtml();
    } else if (state.tab === "guardados") {
      var savedList = favIds.map(function (id) { return byId.get(id); }).filter(Boolean);
      if (!savedList.length) {
        mainHtml += emptyHtml("Nada guardado ainda", "O coração, na lista, fica nesta gaveta — para quando não apetece pensar.");
      } else {
        mainHtml += '<ul class="cards">' + savedList.map(cardHtml).join("") + '</ul>';
      }
    } else {
      if (showingList()) {
        var filtered = currentFiltered();
        var zonas = state.provincia ? zonasFor(state.provincia) : [];
        var tipos = tiposPresent(filtered);
        mainHtml += listResultsHtml(filtered, zonas, tipos);
      } else {
        mainHtml += '<p class="lede">Escolhe uma terra, ou deixa a casa decidir.</p>' + regionIndexHtml();
      }
    }
    mainHtml += '</main>';

    app.innerHTML = headerHtml + mainHtml;
    wireEvents();
  }

  function wireEvents() {
    var searchEl = document.getElementById("search");
    if (searchEl) {
      searchEl.addEventListener("input", function (e) {
        state.search = e.target.value; state.focus = null; state.tab = "lista";
        var caret = e.target.selectionStart;
        render();
        var again = document.getElementById("search");
        if (again) { again.focus(); again.setSelectionRange(caret, caret); }
      });
    }
    var clearSearch = document.getElementById("clear-search");
    if (clearSearch) clearSearch.addEventListener("click", function () { state.search = ""; render(); document.getElementById("search").focus(); });

    var decideBtn = document.getElementById("decide-btn");
    if (decideBtn) decideBtn.addEventListener("click", decide);

    var locEl = document.getElementById("loc-input");
    if (locEl) {
      locEl.addEventListener("input", function (e) {
        state.myLocation = e.target.value;
        saveLoc(state.myLocation);
        var caret = e.target.selectionStart;
        render();
        var again = document.getElementById("loc-input");
        if (again) { again.focus(); again.setSelectionRange(caret, caret); }
      });
    }
    var clearLoc = document.getElementById("clear-loc");
    if (clearLoc) clearLoc.addEventListener("click", function () {
      state.myLocation = ""; saveLoc(""); render();
      var again = document.getElementById("loc-input");
      if (again) again.focus();
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"), function (btn) {
      btn.addEventListener("click", function () { state.tab = btn.getAttribute("data-tab"); render(); });
    });

    var clearBtn = document.getElementById("clear-btn");
    if (clearBtn) clearBtn.addEventListener("click", clearFilters);

    Array.prototype.forEach.call(document.querySelectorAll("[data-region]"), function (btn) {
      btn.addEventListener("click", function () {
        var p = btn.getAttribute("data-region");
        selectProvincia(state.provincia === p ? null : p);
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-zona]"), function (btn) {
      btn.addEventListener("click", function () {
        var z = btn.getAttribute("data-zona");
        state.zona = (state.zona === z || !z) ? (state.zona === z ? null : null) : z;
        state.zona = (btn.getAttribute("data-zona") === "") ? null : (state.zona);
        // simpler: recompute directly
        var chosen = btn.getAttribute("data-zona");
        state.zona = chosen === "" ? null : (state.zona === chosen ? null : chosen);
        render();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-tipo]"), function (btn) {
      btn.addEventListener("click", function () {
        var chosen = btn.getAttribute("data-tipo");
        state.tipo = chosen === "" ? null : (state.tipo === chosen ? null : chosen);
        render();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-want]"), function (btn) {
      btn.addEventListener("click", function () {
        var ids = btn.getAttribute("data-ids").split(",").map(Number);
        onQuickPick({ want: btn.getAttribute("data-want"), ids: ids });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function (btn) {
      btn.addEventListener("click", function () { openDrawer(Number(btn.getAttribute("data-open"))); });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-fav]"), function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleFav(Number(btn.getAttribute("data-fav")));
        render();
        if (state.selectedId != null) renderDrawer();
      });
    });
  }

  // ---- Geocodificação sob demanda (Nominatim / OpenStreetMap) ----
  var GEO_KEY = "guia-porta-10a-geo-v1";
  function loadGeoCache() {
    try { return JSON.parse(localStorage.getItem(GEO_KEY) || "{}"); } catch (e) { return {}; }
  }
  function saveGeoCache(cache) {
    try { localStorage.setItem(GEO_KEY, JSON.stringify(cache)); } catch (e) {}
  }
  var geoCache = loadGeoCache();
  var miniMapInstance = null;

  function geocode(r) {
    var cached = geoCache[r.id];
    if (cached) return Promise.resolve(cached);
    var url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(r.mapsQuery);
    return fetch(url, { headers: { "Accept": "application/json" } })
      .then(function (res) { if (!res.ok) throw new Error("geocode failed"); return res.json(); })
      .then(function (data) {
        if (!data || !data.length) throw new Error("sem resultado");
        var coords = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        geoCache[r.id] = coords;
        saveGeoCache(geoCache);
        return coords;
      });
  }

  function loadMiniMap(r) {
    var container = document.getElementById("mini-map");
    if (!container) return;
    if (miniMapInstance) { miniMapInstance.remove(); miniMapInstance = null; }
    if (typeof L === "undefined") {
      container.innerHTML = '<div class="mini-map-status">Mapa indisponível offline.</div>';
      return;
    }
    container.innerHTML = '<div class="mini-map-status">A localizar no mapa…</div>';
    geocode(r).then(function (coords) {
      if (state.selectedId !== r.id) return; // a gaveta já mudou entretanto
      container.innerHTML = "";
      miniMapInstance = L.map(container, { attributionControl: true, zoomControl: false }).setView([coords.lat, coords.lon], 15);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a>'
      }).addTo(miniMapInstance);
      L.marker([coords.lat, coords.lon]).addTo(miniMapInstance);
    }).catch(function () {
      if (state.selectedId !== r.id) return;
      container.innerHTML = '<div class="mini-map-status">Não foi possível localizar no mapa. Usa os links de "Como chegar" abaixo.</div>';
    });
  }

  // ---- Drawer ----
  var overlay = document.getElementById("overlay");
  var drawer = document.getElementById("drawer");
  var drawerBody = document.getElementById("drawer-body");

  function openDrawer(id) {
    state.selectedId = id;
    renderDrawer();
    overlay.classList.add("open");
    drawer.classList.add("open");
  }
  function closeDrawer() {
    overlay.classList.remove("open");
    drawer.classList.remove("open");
    state.selectedId = null;
    if (miniMapInstance) { miniMapInstance.remove(); miniMapInstance = null; }
  }
  overlay.addEventListener("click", closeDrawer);

  function renderDrawer() {
    var r = byId.get(state.selectedId);
    if (!r) { drawerBody.innerHTML = ""; return; }
    var fav = isFav(r.id);
    var tipoLabel = r.tipo ? (TIPO_LABEL[r.tipo] || r.tipo) : "";
    var html =
      '<div class="drawer-top">' +
        '<div class="min0"><h2 class="drawer-title">' + esc(r.nome) + '</h2>' +
          '<p class="drawer-place">' + esc(placeLine(r)) + '</p></div>' +
        '<button type="button" class="fav-btn' + (fav ? ' saved' : '') + '" id="drawer-fav" aria-label="Guardar">' + ICON.heart + '</button>' +
      '</div>' +
      '<div class="drawer-tags">' +
        (tipoLabel ? '<span class="tag">' + esc(tipoLabel) + '</span>' : '') +
        (r.estado === "incerto" ? '<span class="tag uncertain">Por confirmar</span>' : '') +
      '</div>' +
      (r.especialidade ? '<p class="drawer-spec">' + esc(r.especialidade) + '</p>' : '') +
      (r.morada ? '<p class="drawer-addr">' + esc(r.morada) + '</p>' : '<p class="drawer-addr">Sem morada completa — o mapa pesquisa pelo nome e a terra.</p>') +
      (r.notas ? '<p class="drawer-notes">' + esc(r.notas) + '</p>' : '') +
      '<div class="mini-map" id="mini-map"><div class="mini-map-status">A localizar no mapa…</div></div>' +
      '<p class="row-label" style="margin-top:0.85rem">Como chegar</p>' + mapsRowHtml(r) +
      '<div class="contact-row">' +
        (r.telefone ? '<a href="' + telHref(r.telefone) + '">' + ICON.phone + ' Ligar</a>' : '<span class="disabled">' + ICON.phone + ' Sem telefone</span>') +
        (r.website ? '<a href="' + websiteHref(r.website) + '" target="_blank" rel="noreferrer">' + ICON.globe + ' Site</a>' : '<span class="disabled">' + ICON.globe + ' Sem site</span>') +
      '</div>';
    drawerBody.innerHTML = html;
    var favBtn = document.getElementById("drawer-fav");
    if (favBtn) favBtn.addEventListener("click", function () { toggleFav(r.id); renderDrawer(); render(); });
    loadMiniMap(r);
  }

  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });

  render();
})();
</script>
</body>
</html>
